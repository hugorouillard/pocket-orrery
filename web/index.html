<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Solanum, a tiny explorable procedural solar system."
    >
    <title>Solanum</title>
    <style>
      :root {
        color-scheme: dark;
        background: #03040b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 50% 45%, #11182e 0%, #050712 42%, #03040b 75%);
        font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
      }

      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #c5cee8;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div class="loading" aria-live="polite">Charting system...</div>
    <canvas id="glcanvas" tabindex="0" aria-label="Solanum simulation"></canvas>
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
      load("solanum.wasm");
    </script>
  </body>
</html>
